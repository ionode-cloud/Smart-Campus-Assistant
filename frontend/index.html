<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Dashboard</title>
  <style>
        :root {
      --primary: #1e3c72;
      --secondary: #f39c12;
      --accent: #27ae60; 
      --bg: #f4f7f6;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: var(--bg); padding: 20px; }

    .dashboard {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      margin: 0 auto;
    }

    .map-wrapper {
      position: relative;
      background: white;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      border: 5px solid white;
    }

    #campusImg { width: 100%; height: 95vh; display: block; }

    .hotspot {
      position: absolute;
      cursor: pointer;
      z-index: 10;
    }

    .hotspot::after {
      content: attr(data-label);
      position: absolute;
      top: -40px;
      left: 50%;
      transform: translateX(-50%) scale(0.8);
      background: var(--accent);
      color: white;
      padding: 8px 15px;
      border-radius: 5px;
      font-weight: bold;
      white-space: nowrap;
      opacity: 0;
      transition: all 0.2s ease;
      pointer-events: none;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    .hotspot::before {
      content: '';
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 10px solid var(--accent);
      opacity: 0;
      transition: all 0.2s ease;
    }

    .hotspot:hover::after, .hotspot:hover::before {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }

    .hotspot:hover {
      background: rgba(39, 174, 96, 0.2);
      border: 2px solid var(--accent);
      border-radius: 8px;
    }

    .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .tag { display: inline-block; padding: 4px 10px; background: #eee; border-radius: 15px; font-size: 12px; margin: 5px 5px 0 0; }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh; padding: 20px;
    }
    .header { 
      text-align: center; margin-bottom: 40px; 
      padding: 30px; border-radius: 20px; 
      background: rgba(255,255,255,0.1); 
      backdrop-filter: blur(10px);
    }
    h1 { 
      font-size: 2.5em; margin-bottom: 10px; 
      color: white; text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }
    .subtitle { 
      color: rgba(255,255,255,0.9); 
      font-size: 1.1em; 
    }
    .content-grid { 
      display: grid; 
      grid-template-columns: 1fr 1fr; 
      gap: 25px; 
      max-width: 1400px;
      margin :3%;
    }
    .card { 
      background: rgba(255,255,255,0.95); 
      padding: 30px; 
      border-radius: 20px; 
      box-shadow: 0 20px 40px rgba(0,0,0,0.15); 
      backdrop-filter: blur(10px);
      border-top: 5px solid;
      transition: all 0.3s ease;
    }
    .card:hover { transform: translateY(-8px); box-shadow: 0 30px 50px rgba(0,0,0,0.2); }
    .events-card { border-top-color: #f39c12; }
    .buses-card { border-top-color: #3498db; }
    .card h3 { 
      color: #2c3e50; 
      margin-bottom: 20px; 
      font-size: 1.5em;
      display: flex; align-items: center; gap: 10px;
    }
    .events-list { list-style: none; }
    .events-list li { 
      padding: 18px; 
      margin-bottom: 12px; 
      background: rgba(243, 156, 18, 0.1); 
      border-radius: 12px; 
      border-left: 4px solid #f39c12;
      transition: all 0.3s ease;
    }
    .events-list li:hover { 
      background: rgba(243, 156, 18, 0.2); 
      transform: translateX(5px);
      box-shadow: 0 5px 15px rgba(243, 156, 18, 0.2);
    }
    table { 
      width: 100%; 
      border-collapse: collapse; 
      border-radius: 12px; 
      overflow: hidden; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }
    th { 
      background: linear-gradient(135deg, #3498db, #2980b9); 
      color: white; 
      padding: 18px; 
      text-align: left; 
      font-weight: 600;
    }
    td { 
      padding: 18px; 
      border-bottom: 1px solid #ecf0f1; 
      background: white;
    }
    tr:hover { background: rgba(52, 152, 219, 0.08); }
    .loading { 
      text-align: center; 
      color: #7f8c8d; 
      font-style: italic; 
      padding: 40px 20px;
    }
    .no-data { 
      text-align: center; 
      color: #95a5a6; 
      padding: 40px 20px;
      font-style: italic;
    }
    @media (max-width: 768px) {
      .content-grid { grid-template-columns: 1fr; }
      h1 { font-size: 2em; }
      body { padding: 15px; }
    }
    .hotspot::after {
  content: attr(data-label) "\A" attr(data-desc);
  white-space: pre-line;
  position: absolute;
  top: -65px;
  left: 50%;
  transform: translateX(-50%) scale(0.9);
  background: var(--accent);
  color: white;
  padding: 10px 14px;
  border-radius: 6px;
  font-size: 13px;
  line-height: 1.4;
  max-width: 300px;
  max-height: 200px;
  text-align: center;
  opacity: 0;
  pointer-events: none;
  transition: all 0.2s ease;
  box-shadow: 0 5px 15px rgba(0,0,0,0.25);
}

.hotspot:hover::after,
.hotspot:hover::before {
  opacity: 1;
  transform: translateX(-50%) scale(1);
}

  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🧠 Smart Campus Assistant</h1>
      <p class="subtitle">Upcoming Events & Bus Schedule</p>
    </div>
    <div class="dashboard">
  <div class="map-wrapper">
    <img src="./image.png" id="campusImg" alt="Campus Map">
    <div class="hotspot"
     data-label="Block C (Nursing)"
     data-desc="Primary academic building for Nursing and Medical Sciences."
     style="left:5%; top:21%; width:18%; height:13%;"
     onclick="updateUI('nursing')">
</div>

<div class="hotspot"
     data-label="Block B (Diploma)"
     data-desc="Central hub for diploma courses, labs, and practical training."
     style="left:39%; top:35%; width:25%; height:18%;"
     onclick="updateUI('diploma')">
</div>

<div class="hotspot"
     data-label="Block A (B.Tech)"
     data-desc="Main engineering block with classrooms, labs, and admin offices."
     style="left:5%; top:45%; width:18%; height:18%;"
     onclick="updateUI('btech')">
</div>

<div class="hotspot"
     data-label="Girls Hostel"
     data-desc="Secure residential facility for female students with 24/7 security."
     style="left:6%; top:75%; width:15%; height:18%;"
     onclick="updateUI('girls_hostel')">
</div>

<div class="hotspot"
     data-label="Boys Hostel"
     data-desc="Student residence for boys located near sports and recreation areas."
     style="left:65%; top:10%; width:15%; height:18%;"
     onclick="updateUI('boys_hostel')">
</div>

<div class="hotspot"
     data-label="Sports Ground"
     data-desc="Large open ground for cricket, football, athletics, and events."
     style="left:23%; top:8%; width:38%; height:25%;"
     onclick="updateUI('ground')">
</div>

<div class="hotspot"
     data-label="Canteen"
     data-desc="Central dining area serving breakfast, lunch, snacks, and beverages."
     style="left:83%; top:53%; width:20%; height:13%;"
     onclick="updateUI('canteen')">
</div>

<div class="hotspot"
     data-label="Transport Hub"
     data-desc="Pickup and drop point for campus and city transport services."
     style="left:63%; top:65%; width:18%; height:20%;"
     onclick="updateUI('bus')">
</div>

<div class="hotspot"
     data-label="Kalam Jr. Science"
     data-desc="Junior college block focused on foundational science education."
     style="left:85%; top:3%; width:15%; height:13%;"
     onclick="updateUI('science')">
</div>

<div class="hotspot"
     data-label="Main Gate"
     data-desc="Primary entrance with security checkpoint and visitor access."
     style="left:23%; top:90%; width:22%; height:10%;"
     onclick="updateUI('girls_hostel')">
</div>
  </div>
</div>

    <div class="content-grid">
      <div class="card events-card">
        <h3>📅 Upcoming Events</h3>
        <ul class="events-list" id="eventsList">
          <li class="loading">Loading events...</li>
        </ul>
      </div>
      <div class="card buses-card">
        <h3>🚌 Bus Schedule</h3>
        <table id="busTable">
          <thead>
            <tr>
              <th>Route</th>
              <th>Timings</th>
              <th>Points</th>
            </tr>
          </thead>
          <tbody>
            <tr class="loading"><td colspan="3">Loading buses...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
  const eventsList = document.getElementById("eventsList");
  const busTable = document.getElementById("busTable");

  const API_BASE = "https://smart-campus-assistant-ixrp.onrender.com/api";

  async function loadData() {
    try {
      // EVENTS
      const eventsResponse = await fetch(`${API_BASE}/events`);
      const events = await eventsResponse.json();

      eventsList.innerHTML = events.length
        ? events
            .map(
              event => `
              <li>
                <strong>${event.title}</strong><br>
                <small>
                  ${new Date(event.date).toLocaleDateString("en-IN")}
                  • ${event.type?.toUpperCase()}
                </small>
              </li>
            `
            )
            .join("")
        : '<li class="no-data">🎉 No upcoming events</li>';

      // BUSES
      const busesResponse = await fetch(`${API_BASE}/buses`);
      const buses = await busesResponse.json();
      const tbody = busTable.querySelector("tbody");

      tbody.innerHTML = buses.length
        ? buses
            .map(
              bus => `
              <tr>
                <td>
                  <strong>${bus.route}</strong><br>
                  <small>${bus.busNumber || ""}</small>
                </td>
                <td>${bus.timings.join("<br>")}</td>
                <td>${bus.points.join(" → ")}</td>
              </tr>
            `
            )
            .join("")
        : '<tr><td colspan="3" class="no-data">🚌 No buses scheduled</td></tr>';
    } catch (error) {
      console.error(error);
      eventsList.innerHTML =
        '<li class="no-data">⚠️ Cannot load events</li>';
      busTable.querySelector("tbody").innerHTML =
        '<tr><td colspan="3" class="no-data">⚠️ Cannot load buses</td></tr>';
    }
  }

  loadData();
  setInterval(loadData, 30000);
});

  </script>
</body>
</html>
